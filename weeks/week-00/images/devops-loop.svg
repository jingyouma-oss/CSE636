<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="dahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="dsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="900" height="250" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">The loop you run in this lab</text>

  <!-- arrows between pills -->
  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="156" y1="105" x2="171" y2="105" marker-end="url(#dah)"/>
    <line x1="299" y1="105" x2="314" y2="105" marker-end="url(#dah)"/>
    <line x1="442" y1="105" x2="457" y2="105" marker-end="url(#dah)"/>
    <line x1="585" y1="105" x2="600" y2="105" marker-end="url(#dah)"/>
    <line x1="728" y1="105" x2="743" y2="105" marker-end="url(#dah)"/>
  </g>

  <!-- 1 Code -->
  <rect x="30" y="72" width="126" height="66" rx="11" fill="url(#s1)" stroke="#4f46e5" stroke-width="2" filter="url(#dsh)"/>
  <text x="93" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1 · Code</text>
  <text x="93" y="120" text-anchor="middle" font-size="10" fill="#475569">edit the app</text>

  <!-- 2 Test -->
  <rect x="173" y="72" width="126" height="66" rx="11" fill="url(#s2)" stroke="#2563eb" stroke-width="2" filter="url(#dsh)"/>
  <text x="236" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2 · Test</text>
  <text x="236" y="120" text-anchor="middle" font-size="10" fill="#475569">make test → 7 passed</text>

  <!-- 3 Run -->
  <rect x="316" y="72" width="126" height="66" rx="11" fill="url(#s3)" stroke="#0891b2" stroke-width="2" filter="url(#dsh)"/>
  <text x="379" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3 · Run</text>
  <text x="379" y="120" text-anchor="middle" font-size="10" fill="#475569">make run → /health ok</text>

  <!-- 4 Containerize -->
  <rect x="459" y="72" width="126" height="66" rx="11" fill="url(#s4)" stroke="#d97706" stroke-width="2" filter="url(#dsh)"/>
  <text x="522" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4 · Containerize</text>
  <text x="522" y="120" text-anchor="middle" font-size="10" fill="#475569">make docker-build</text>

  <!-- 5 Push -->
  <rect x="602" y="72" width="126" height="66" rx="11" fill="url(#s5)" stroke="#db2777" stroke-width="2" filter="url(#dsh)"/>
  <text x="665" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5 · Push</text>
  <text x="665" y="120" text-anchor="middle" font-size="10" fill="#475569">git push → GitHub</text>

  <!-- 6 CI green -->
  <rect x="745" y="72" width="126" height="66" rx="11" fill="url(#s6)" stroke="#16a34a" stroke-width="2" filter="url(#dsh)"/>
  <text x="808" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">6 · CI ✅</text>
  <text x="808" y="120" text-anchor="middle" font-size="10" fill="#475569">Actions runs the tests</text>

  <!-- loop-back arrow from CI to Code -->
  <path d="M 808 138 C 808 200 93 200 93 142" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#dahg)"/>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#15803d">…and around again — every change rides the same loop</text>
</svg>
