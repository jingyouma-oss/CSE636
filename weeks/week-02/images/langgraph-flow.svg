<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <marker id="gahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <marker id="gahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="gnode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="gpr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gdbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <filter id="gsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="700" height="360" fill="#f8fafc"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">LangGraph: a workflow as a graph with decision edges</text>

  <!-- Start -->
  <rect x="40" y="60" width="96" height="44" rx="22" fill="#0f172a"/>
  <text x="88" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Start</text>

  <!-- Planner -->
  <rect x="172" y="58" width="130" height="48" rx="11" fill="url(#gnode)" stroke="#4f46e5" stroke-width="2" filter="url(#gsh)"/>
  <text x="237" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Planner</text>

  <!-- Code Editor -->
  <rect x="340" y="58" width="130" height="48" rx="11" fill="url(#gnode)" stroke="#4f46e5" stroke-width="2" filter="url(#gsh)"/>
  <text x="405" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Code Editor</text>
  <text x="405" y="96" text-anchor="middle" font-size="9.5" fill="#64748b">writes the change</text>

  <!-- decision diamond (text label) -->
  <text x="405" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">tests pass?</text>

  <!-- Open PR (pass) -->
  <rect x="500" y="58" width="150" height="48" rx="11" fill="url(#gpr)" stroke="#16a34a" stroke-width="2" filter="url(#gsh)"/>
  <text x="575" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Open PR</text>
  <text x="575" y="96" text-anchor="middle" font-size="9.5" fill="#15803d">✓ done</text>

  <!-- Debug Agent (fail) -->
  <rect x="340" y="250" width="130" height="56" rx="11" fill="url(#gdbg)" stroke="#db2777" stroke-width="2" filter="url(#gsh)"/>
  <text x="405" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Debug Agent</text>
  <text x="405" y="293" text-anchor="middle" font-size="9.5" fill="#be185d">diagnoses failure</text>

  <!-- edges -->
  <line x1="136" y1="82" x2="170" y2="82" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#gah)"/>
  <line x1="302" y1="82" x2="338" y2="82" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#gah)"/>
  <!-- pass edge to PR -->
  <line x1="470" y1="82" x2="498" y2="82" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gahg)"/>
  <text x="484" y="74" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">pass</text>
  <!-- fail edge down to Debug -->
  <path d="M 405 106 L 405 248" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#gahr)"/>
  <text x="420" y="180" font-size="9" font-weight="700" fill="#be185d">fail</text>
  <!-- loop back from Debug to Code Editor -->
  <path d="M 340 278 C 230 278 230 110 338 92" fill="none" stroke="#db2777" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#gahr)"/>
  <text x="232" y="186" text-anchor="middle" font-size="9.5" fill="#be185d">retry until green</text>

  <text x="350" y="338" text-anchor="middle" font-size="11" fill="#64748b">Conditional edges + loops + human-in-the-loop pause points are first-class in LangGraph.</text>
</svg>
