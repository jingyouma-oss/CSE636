<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="xah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="host" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <filter id="xsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MCP architecture: Host · Client · Servers</text>

  <!-- Host container -->
  <rect x="180" y="52" width="400" height="120" rx="14" fill="url(#host)" stroke="#4f46e5" stroke-width="2.5" filter="url(#xsh)"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">MCP Host (the agent app — e.g. Claude Code)</text>

  <rect x="210" y="92" width="150" height="62" rx="10" fill="url(#core)" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">LLM Core</text>
  <text x="285" y="138" text-anchor="middle" font-size="10" fill="#475569">reasons &amp; decides</text>

  <rect x="400" y="92" width="150" height="62" rx="10" fill="url(#client)" stroke="#6366f1" stroke-width="2"/>
  <text x="475" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MCP Client</text>
  <text x="475" y="138" text-anchor="middle" font-size="10" fill="#475569">manages connections</text>

  <line x1="360" y1="123" x2="398" y2="123" stroke="#6366f1" stroke-width="2.5" marker-end="url(#xah)" marker-start="url(#xah)"/>

  <!-- protocol label -->
  <rect x="246" y="190" width="268" height="22" rx="11" fill="#7c3aed"/>
  <text x="380" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">JSON-RPC over stdio / HTTP+SSE</text>

  <!-- fan-out from client to servers -->
  <path d="M 475 154 C 475 230 150 220 130 280" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#xah)"/>
  <path d="M 475 154 C 475 235 380 235 380 280" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#xah)"/>
  <path d="M 475 154 C 475 230 610 220 630 280" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#xah)"/>

  <!-- servers -->
  <rect x="40" y="282" width="180" height="92" rx="12" fill="url(#server)" stroke="#7c3aed" stroke-width="1.5" filter="url(#xsh)"/>
  <text x="130" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MCP Server</text>
  <text x="130" y="328" text-anchor="middle" font-size="12" fill="#7c3aed">GitHub</text>
  <text x="130" y="350" text-anchor="middle" font-size="9.5" fill="#475569">PRs · files · issues</text>

  <rect x="290" y="282" width="180" height="92" rx="12" fill="url(#server)" stroke="#7c3aed" stroke-width="1.5" filter="url(#xsh)"/>
  <text x="380" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MCP Server</text>
  <text x="380" y="328" text-anchor="middle" font-size="12" fill="#7c3aed">Jenkins</text>
  <text x="380" y="350" text-anchor="middle" font-size="9.5" fill="#475569">build · status · logs</text>

  <rect x="540" y="282" width="180" height="92" rx="12" fill="url(#server)" stroke="#7c3aed" stroke-width="1.5" filter="url(#xsh)"/>
  <text x="630" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MCP Server</text>
  <text x="630" y="328" text-anchor="middle" font-size="12" fill="#7c3aed">Postgres DB</text>
  <text x="630" y="350" text-anchor="middle" font-size="9.5" fill="#475569">query rows</text>

  <text x="380" y="402" text-anchor="middle" font-size="11" fill="#64748b">Each server wraps one system and declares its tools; the client calls them at runtime.</text>
</svg>
