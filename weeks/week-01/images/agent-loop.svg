<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="680" height="420" fill="#f8fafc"/>
  <text x="340" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">An AI agent runs a loop</text>

  <!-- clockwise arrows -->
  <path d="M 280 110 L 398 110" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M 520 150 L 520 258" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M 400 300 L 282 300" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M 160 260 L 160 152" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 1 Perceive (top-left) -->
  <rect x="60" y="72" width="220" height="76" rx="12" fill="url(#gP)" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="170" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1 · Perceive</text>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#475569">read the task, logs, code, alerts</text>

  <!-- 2 Plan / Reason (top-right) -->
  <rect x="400" y="72" width="220" height="76" rx="12" fill="url(#gR)" stroke="#4f46e5" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2 · Plan / Reason</text>
  <text x="510" y="125" text-anchor="middle" font-size="11" fill="#475569">the LLM decides what to do next</text>

  <!-- 3 Act (bottom-right) -->
  <rect x="400" y="262" width="220" height="76" rx="12" fill="url(#gA)" stroke="#db2777" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3 · Act</text>
  <text x="510" y="315" text-anchor="middle" font-size="11" fill="#475569">call a tool: run, edit, open a PR</text>

  <!-- 4 Observe (bottom-left) -->
  <rect x="60" y="262" width="220" height="76" rx="12" fill="url(#gO)" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="170" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4 · Observe</text>
  <text x="170" y="315" text-anchor="middle" font-size="11" fill="#475569">read the result, then repeat</text>

  <!-- center hub -->
  <rect x="246" y="178" width="188" height="64" rx="10" fill="#0f172a"/>
  <text x="340" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LLM + tools + a goal</text>
  <text x="340" y="225" text-anchor="middle" font-size="10.5" fill="#94a3b8">loops until done or limit hit</text>
</svg>
