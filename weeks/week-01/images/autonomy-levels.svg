<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="lah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <filter id="lsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="840" height="380" fill="#ffffff"/>
  <text x="420" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Levels of autonomy — how much does the human stay in the picture?</text>

  <!-- top axis: autonomy increases -->
  <line x1="40" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="2" marker-end="url(#lah)"/>
  <text x="44" y="42" font-size="10.5" fill="#94a3b8">human decides everything</text>
  <text x="796" y="42" text-anchor="end" font-size="10.5" fill="#94a3b8">agent decides everything · bigger blast radius →</text>

  <!-- Level 1 -->
  <rect x="30" y="262" width="186" height="86" rx="12" fill="url(#l1)" stroke="#16a34a" stroke-width="2" filter="url(#lsh)"/>
  <text x="46" y="288" font-size="22" font-weight="800" fill="#15803d">1</text>
  <text x="72" y="285" font-size="13" font-weight="700" fill="#0f172a">AI assistant</text>
  <text x="46" y="312" font-size="10.5" fill="#475569">AI suggests; the human</text>
  <text x="46" y="327" font-size="10.5" fill="#475569">decides and acts.</text>
  <text x="46" y="343" font-size="9.5" font-style="italic" fill="#64748b">e.g. autocomplete you accept</text>

  <!-- Level 2 -->
  <rect x="226" y="210" width="186" height="138" rx="12" fill="url(#l2)" stroke="#2563eb" stroke-width="2" filter="url(#lsh)"/>
  <text x="242" y="236" font-size="22" font-weight="800" fill="#1d4ed8">2</text>
  <text x="268" y="233" font-size="13" font-weight="700" fill="#0f172a">Human-in-loop</text>
  <text x="242" y="260" font-size="10.5" fill="#475569">Agent acts, but pauses</text>
  <text x="242" y="275" font-size="10.5" fill="#475569">for approval each step.</text>
  <text x="242" y="297" font-size="9.5" font-style="italic" fill="#64748b">e.g. proposes a PR;</text>
  <text x="242" y="311" font-size="9.5" font-style="italic" fill="#64748b">you review &amp; merge</text>

  <!-- Level 3 -->
  <rect x="422" y="150" width="186" height="198" rx="12" fill="url(#l3)" stroke="#d97706" stroke-width="2" filter="url(#lsh)"/>
  <text x="438" y="176" font-size="22" font-weight="800" fill="#b45309">3</text>
  <text x="464" y="173" font-size="13" font-weight="700" fill="#0f172a">Human-on-loop</text>
  <text x="438" y="200" font-size="10.5" fill="#475569">Agent acts on its own;</text>
  <text x="438" y="215" font-size="10.5" fill="#475569">human monitors and can</text>
  <text x="438" y="230" font-size="10.5" fill="#475569">step in.</text>
  <text x="438" y="252" font-size="9.5" font-style="italic" fill="#64748b">e.g. auto-patches while</text>
  <text x="438" y="266" font-size="9.5" font-style="italic" fill="#64748b">an SRE watches</text>

  <!-- Level 4 -->
  <rect x="618" y="92" width="192" height="256" rx="12" fill="url(#l4)" stroke="#db2777" stroke-width="2" filter="url(#lsh)"/>
  <text x="634" y="118" font-size="22" font-weight="800" fill="#be185d">4</text>
  <text x="660" y="115" font-size="13" font-weight="700" fill="#0f172a">Fully autonomous</text>
  <text x="634" y="142" font-size="10.5" fill="#475569">Agent acts with no human</text>
  <text x="634" y="157" font-size="10.5" fill="#475569">involvement.</text>
  <text x="634" y="179" font-size="9.5" font-style="italic" fill="#64748b">e.g. auto-scales, auto-heals,</text>
  <text x="634" y="193" font-size="9.5" font-style="italic" fill="#64748b">auto-remediates 24/7</text>
  <text x="634" y="220" font-size="10" font-weight="700" fill="#be185d">Needs the strongest</text>
  <text x="634" y="234" font-size="10" font-weight="700" fill="#be185d">guardrails.</text>

  <text x="420" y="372" text-anchor="middle" font-size="11.5" fill="#475569">Most real deployments live at levels 2–3. Pick the level by the task's blast radius.</text>
</svg>
