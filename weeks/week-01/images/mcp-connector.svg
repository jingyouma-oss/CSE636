<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <filter id="msh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MCP — a universal connector, like USB for AI agents</text>

  <!-- Agent (MCP client) -->
  <rect x="34" y="150" width="190" height="110" rx="14" fill="url(#agent)" stroke="#4f46e5" stroke-width="2.5" filter="url(#msh)"/>
  <text x="129" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Agent</text>
  <text x="129" y="218" text-anchor="middle" font-size="12" fill="#4338ca">(MCP client)</text>

  <!-- connectors with MCP badges -->
  <path d="M 224 178 C 320 178 300 92 414 92"  fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mah)"/>
  <path d="M 224 192 C 320 192 300 170 414 170" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mah)"/>
  <path d="M 224 220 C 320 220 300 250 414 250" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mah)"/>
  <path d="M 224 234 C 320 234 300 328 414 328" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mah)"/>
  <rect x="300" y="196" width="52" height="20" rx="10" fill="#7c3aed"/>
  <text x="326" y="210" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">MCP</text>

  <!-- MCP servers -->
  <rect x="416" y="62"  width="372" height="62" rx="12" fill="url(#srv)" stroke="#7c3aed" stroke-width="1.5" filter="url(#msh)"/>
  <text x="432" y="88" font-size="13" font-weight="700" fill="#0f172a">MCP Server · GitHub</text>
  <text x="432" y="108" font-size="10.5" fill="#475569">create PR · read files · list issues</text>

  <rect x="416" y="140" width="372" height="62" rx="12" fill="url(#srv)" stroke="#7c3aed" stroke-width="1.5" filter="url(#msh)"/>
  <text x="432" y="166" font-size="13" font-weight="700" fill="#0f172a">MCP Server · Jenkins</text>
  <text x="432" y="186" font-size="10.5" fill="#475569">trigger build · get status · get logs</text>

  <rect x="416" y="218" width="372" height="62" rx="12" fill="url(#srv)" stroke="#7c3aed" stroke-width="1.5" filter="url(#msh)"/>
  <text x="432" y="244" font-size="13" font-weight="700" fill="#0f172a">MCP Server · Datadog</text>
  <text x="432" y="264" font-size="10.5" fill="#475569">query metrics · list monitors · create alert</text>

  <rect x="416" y="296" width="372" height="62" rx="12" fill="url(#srv)" stroke="#7c3aed" stroke-width="1.5" filter="url(#msh)"/>
  <text x="432" y="322" font-size="13" font-weight="700" fill="#0f172a">MCP Server · Kubectl</text>
  <text x="432" y="342" font-size="10.5" fill="#475569">get pods · scale deployment · describe service</text>

  <text x="129" y="300" text-anchor="middle" font-size="10.5" fill="#475569">Write one MCP server per tool —</text>
  <text x="129" y="315" text-anchor="middle" font-size="10.5" fill="#475569">any MCP agent can use it.</text>
</svg>
