<svg xmlns="http://www.w3.org/2000/svg" width="940" height="230" viewBox="0 0 940 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="e1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="e2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="e4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <filter id="esh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/></filter>
  </defs>

  <rect x="0" y="0" width="940" height="230" fill="#ffffff"/>
  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Each wave answered a new pressure of scale</text>

  <!-- baseline arrow showing increasing autonomy -->
  <line x1="30" y1="200" x2="905" y2="200" stroke="#cbd5e1" stroke-width="2" marker-end="url(#tah)"/>
  <text x="40" y="222" font-size="10.5" fill="#94a3b8">more manual</text>
  <text x="900" y="222" text-anchor="end" font-size="10.5" fill="#94a3b8">more autonomous →</text>

  <!-- Stage 1 DevOps -->
  <rect x="30" y="50" width="200" height="128" rx="12" fill="url(#e1)" stroke="#94a3b8" stroke-width="1.5" filter="url(#esh)"/>
  <text x="130" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">DevOps</text>
  <rect x="92" y="88" width="76" height="20" rx="10" fill="#475569"/><text x="130" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2009 –</text>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="#475569">Collaboration +</text>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#475569">automation + CI/CD</text>

  <!-- Stage 2 DevSecOps -->
  <rect x="255" y="50" width="200" height="128" rx="12" fill="url(#e2)" stroke="#2563eb" stroke-width="1.5" filter="url(#esh)"/>
  <text x="355" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">DevSecOps</text>
  <rect x="317" y="88" width="76" height="20" rx="10" fill="#2563eb"/><text x="355" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2012 –</text>
  <text x="355" y="130" text-anchor="middle" font-size="11" fill="#475569">Security built into</text>
  <text x="355" y="146" text-anchor="middle" font-size="11" fill="#475569">every pipeline stage</text>

  <!-- Stage 3 AIOps -->
  <rect x="480" y="50" width="200" height="128" rx="12" fill="url(#e3)" stroke="#7c3aed" stroke-width="1.5" filter="url(#esh)"/>
  <text x="580" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">AIOps</text>
  <rect x="542" y="88" width="76" height="20" rx="10" fill="#7c3aed"/><text x="580" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2017 –</text>
  <text x="580" y="130" text-anchor="middle" font-size="11" fill="#475569">ML reads telemetry —</text>
  <text x="580" y="146" text-anchor="middle" font-size="11" fill="#475569">detects, doesn't act</text>

  <!-- Stage 4 Agentic DevOps -->
  <rect x="705" y="50" width="205" height="128" rx="12" fill="url(#e4)" stroke="#db2777" stroke-width="2" filter="url(#esh)"/>
  <text x="807" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Agentic DevOps</text>
  <rect x="769" y="88" width="76" height="20" rx="10" fill="#db2777"/><text x="807" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2024 –</text>
  <text x="807" y="130" text-anchor="middle" font-size="11" fill="#475569">Agents that plan</text>
  <text x="807" y="146" text-anchor="middle" font-size="11" fill="#475569">and take action</text>
</svg>
