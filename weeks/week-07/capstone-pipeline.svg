<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cpah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="cpintent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="cp1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="cp2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="cp3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="cp4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="cp5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <linearGradient id="cpdone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="cpsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="760" height="640" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">The end-to-end agentic DevOps pipeline (the capstone)</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="280" y1="82" x2="280" y2="100" marker-end="url(#cpah)"/>
    <line x1="280" y1="162" x2="280" y2="180" marker-end="url(#cpah)"/>
    <line x1="280" y1="242" x2="280" y2="260" marker-end="url(#cpah)"/>
    <line x1="280" y1="322" x2="280" y2="340" marker-end="url(#cpah)"/>
    <line x1="280" y1="420" x2="280" y2="438" marker-end="url(#cpah)"/>
  </g>

  <!-- intent -->
  <rect x="90" y="46" width="380" height="36" rx="10" fill="url(#cpintent)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Developer intent</text>
  <text x="280" y="77" text-anchor="middle" font-size="9" fill="#475569">"deploy checkout v2.3.1 + a new Postgres index; ~20% more traffic"</text>

  <!-- stage 1 -->
  <rect x="80" y="100" width="400" height="62" rx="11" fill="url(#cp1)" stroke="#4f46e5" stroke-width="2" filter="url(#cpsh)"/>
  <text x="100" y="124" font-size="12.5" font-weight="800" fill="#4338ca">1 · Agentic CI/CD</text>
  <text x="100" y="142" font-size="9.5" fill="#475569">code review · test gen · build-failure triage</text>
  <text x="100" y="156" font-size="9" font-weight="700" fill="#b45309">🔒 human approval gate</text>
  <rect x="410" y="112" width="56" height="20" rx="10" fill="#4f46e5"/><text x="438" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Wk 3</text>

  <!-- stage 2 -->
  <rect x="80" y="180" width="400" height="62" rx="11" fill="url(#cp2)" stroke="#7c3aed" stroke-width="2" filter="url(#cpsh)"/>
  <text x="100" y="204" font-size="12.5" font-weight="800" fill="#6d28d9">2 · Agentic IaC</text>
  <text x="100" y="222" font-size="9.5" fill="#475569">Terraform gen · OPA policy check · plan-review gate</text>
  <text x="100" y="236" font-size="9" font-weight="700" fill="#b45309">🔒 OPA blocks + human approves the plan · SLSA provenance</text>
  <rect x="410" y="192" width="56" height="20" rx="10" fill="#7c3aed"/><text x="438" y="206" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Wk 7</text>

  <!-- stage 3 -->
  <rect x="80" y="260" width="400" height="62" rx="11" fill="url(#cp3)" stroke="#0891b2" stroke-width="2" filter="url(#cpsh)"/>
  <text x="100" y="284" font-size="12.5" font-weight="800" fill="#0e7490">3 · Predictive deploy</text>
  <text x="100" y="302" font-size="9.5" fill="#475569">risk score (ML) · canary / blue-green · FinOps cost estimate</text>
  <text x="100" y="316" font-size="9" font-weight="700" fill="#b45309">🔒 canary gated on error-rate metrics</text>
  <rect x="410" y="272" width="56" height="20" rx="10" fill="#0891b2"/><text x="438" y="286" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Wk 4</text>

  <!-- stage 4 -->
  <rect x="80" y="340" width="400" height="62" rx="11" fill="url(#cp4)" stroke="#d97706" stroke-width="2" filter="url(#cpsh)"/>
  <text x="100" y="364" font-size="12.5" font-weight="800" fill="#b45309">4 · Observability</text>
  <text x="100" y="382" font-size="9.5" fill="#475569">OTel traces &amp; metrics (service + agents) · anomaly detection · AI RCA</text>
  <text x="100" y="396" font-size="9" font-weight="700" fill="#b45309">alert fires within 60s · agent can't act until it does</text>
  <rect x="410" y="352" width="56" height="20" rx="10" fill="#d97706"/><text x="438" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Wk 5</text>

  <!-- decision -->
  <text x="280" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">anomaly detected?</text>

  <!-- branch: NO -->
  <line x1="280" y1="438" x2="280" y2="460" stroke="#16a34a" stroke-width="2.5" marker-end="url(#cpah)"/>
  <rect x="120" y="462" width="320" height="34" rx="11" fill="url(#cpdone)" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="484" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">NO → deployment complete ✓</text>

  <!-- branch: YES to stage 5 -->
  <path d="M 480 408 C 600 408 600 460 600 510" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#cpah)"/>
  <text x="612" y="450" font-size="9" font-weight="700" fill="#be185d">YES</text>

  <rect x="430" y="512" width="300" height="96" rx="11" fill="url(#cp5)" stroke="#db2777" stroke-width="2.5" filter="url(#cpsh)"/>
  <text x="450" y="536" font-size="12.5" font-weight="800" fill="#be185d">5 · Auto-remediate</text>
  <text x="450" y="554" font-size="9.5" fill="#475569">agentic SRE runbook · blast-radius check</text>
  <text x="450" y="569" font-size="9.5" fill="#475569">rollback / scale-up · ITSM ticket</text>
  <text x="450" y="584" font-size="9.5" fill="#475569">postmortem summary</text>
  <text x="450" y="600" font-size="9" font-weight="700" fill="#b45309">🔒 min tools · all actions logged · blast-radius limit</text>
  <rect x="666" y="520" width="52" height="20" rx="10" fill="#db2777"/><text x="692" y="534" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Wk 6</text>

  <!-- feedback to stage 4 -->
  <path d="M 430 560 C 40 560 40 371 78 371" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cpah)"/>
  <text x="48" y="470" font-size="8.5" fill="#94a3b8" transform="rotate(90 48 470)">re-observe after remediation</text>

  <text x="280" y="624" text-anchor="middle" font-size="10.5" fill="#64748b">Guardrails at every stage — the recurring safety lesson of the whole course.</text>
</svg>
