<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="iwah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="iwreq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="iwagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="iwplan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="iwopa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <linearGradient id="iwhuman" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="iwapply" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="iwsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="500" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Agent proposes · policy enforces · human approves · tooling applies</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="320" y1="62" x2="320" y2="80" marker-end="url(#iwah)"/>
    <line x1="320" y1="128" x2="320" y2="146" marker-end="url(#iwah)"/>
    <line x1="320" y1="194" x2="320" y2="212" marker-end="url(#iwah)"/>
    <line x1="320" y1="278" x2="320" y2="296" marker-end="url(#iwah)"/>
    <line x1="320" y1="344" x2="320" y2="362" marker-end="url(#iwah)"/>
    <line x1="320" y1="410" x2="320" y2="428" marker-end="url(#iwah)"/>
  </g>

  <rect x="170" y="40" width="300" height="22" rx="10" fill="url(#iwreq)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Developer request (natural language)</text>

  <rect x="150" y="82" width="340" height="46" rx="11" fill="url(#iwagent)" stroke="#4f46e5" stroke-width="2" filter="url(#iwsh)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" font-weight="800" fill="#4338ca">Agent generates Terraform</text>
  <text x="320" y="121" text-anchor="middle" font-size="9.5" fill="#475569">LLM with an IaC-aware prompt → HCL</text>

  <rect x="150" y="148" width="340" height="46" rx="11" fill="url(#iwplan)" stroke="#0891b2" stroke-width="2" filter="url(#iwsh)"/>
  <text x="320" y="170" text-anchor="middle" font-size="12" font-weight="800" fill="#0e7490">terraform plan (dry run)</text>
  <text x="320" y="187" text-anchor="middle" font-size="9.5" fill="#475569">agent reads the plan — any unexpected destroys?</text>

  <rect x="150" y="214" width="340" height="64" rx="11" fill="url(#iwopa)" stroke="#db2777" stroke-width="2.5" filter="url(#iwsh)"/>
  <text x="320" y="237" text-anchor="middle" font-size="12" font-weight="800" fill="#be185d">OPA / policy check (conftest)</text>
  <text x="320" y="256" text-anchor="middle" font-size="10" fill="#b91c1c">BLOCK if any rule fires</text>
  <text x="320" y="271" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">encryption? public access? required tags?</text>

  <rect x="150" y="298" width="340" height="46" rx="11" fill="url(#iwhuman)" stroke="#d97706" stroke-width="2" filter="url(#iwsh)"/>
  <text x="320" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">Human review &amp; approval</text>
  <text x="320" y="337" text-anchor="middle" font-size="9.5" fill="#475569">pull request / Atlantis workflow</text>

  <rect x="150" y="364" width="340" height="46" rx="11" fill="url(#iwapply)" stroke="#16a34a" stroke-width="2" filter="url(#iwsh)"/>
  <text x="320" y="386" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">terraform apply</text>
  <text x="320" y="403" text-anchor="middle" font-size="9.5" fill="#475569">the standard toolchain applies — not the agent</text>

  <rect x="190" y="430" width="260" height="40" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#0f172a">State updated · telemetry + provenance emitted</text>
  <text x="320" y="463" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">the agent never applies infrastructure directly</text>
</svg>
