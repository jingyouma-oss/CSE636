<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="tssh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="700" height="340" fill="#f8fafc"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Least privilege: an IaC-review agent's tool belt</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#64748b">An attacker who achieves prompt injection cannot call a tool that does not exist.</text>

  <!-- ALLOWED column -->
  <rect x="36" y="66" width="300" height="248" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="186" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">✓ Tools it HAS (scoped)</text>

  <g font-size="11">
    <rect x="56" y="104" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="122" font-weight="700" fill="#0f172a">git_read_file</text>
    <text x="70" y="139" fill="#475569" font-size="9.5">read-only, one specific repo</text>

    <rect x="56" y="154" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="172" font-weight="700" fill="#0f172a">terraform_plan</text>
    <text x="70" y="189" fill="#475569" font-size="9.5">in a sandbox, no apply</text>

    <rect x="56" y="204" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="222" font-weight="700" fill="#0f172a">opa_eval</text>
    <text x="70" y="239" fill="#475569" font-size="9.5">read-only policy check</text>

    <rect x="56" y="254" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="272" font-weight="700" fill="#0f172a">github_pr_comment</text>
    <text x="70" y="289" fill="#475569" font-size="9.5">write, but comments only</text>
  </g>

  <!-- DENIED column -->
  <rect x="364" y="66" width="300" height="248" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="514" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">✗ Tools it must NOT have</text>

  <g font-size="11">
    <rect x="384" y="104" width="260" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="398" y="129" font-weight="700" fill="#7f1d1d">terraform_apply</text>

    <rect x="384" y="150" width="260" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="398" y="175" font-weight="700" fill="#7f1d1d">git_push</text>

    <rect x="384" y="196" width="260" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="398" y="221" font-weight="700" fill="#7f1d1d">aws_cli_exec</text>

    <rect x="384" y="242" width="260" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="398" y="267" font-weight="700" fill="#7f1d1d">run_shell_command</text>
  </g>

  <text x="514" y="304" text-anchor="middle" font-size="9.5" fill="#7f1d1d">Removing these is an architectural constraint, not a setting.</text>
</svg>
