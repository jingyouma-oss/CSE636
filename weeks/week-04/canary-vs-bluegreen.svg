<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cbah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="stable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="newv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <filter id="cbsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="760" height="340" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Two ways to roll out safely</text>

  <!-- divider -->
  <line x1="380" y1="50" x2="380" y2="320" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== CANARY (left) ===== -->
  <text x="190" y="68" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">Canary — gradual</text>

  <circle cx="80" cy="120" r="22" fill="#e2e8f0"/><text x="80" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">users</text>
  <line x1="102" y1="116" x2="138" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#cbah)"/>
  <line x1="102" y1="126" x2="138" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#cbah)"/>

  <rect x="140" y="82" width="180" height="38" rx="9" fill="url(#stable)" stroke="#2563eb" stroke-width="2" filter="url(#cbsh)"/>
  <text x="230" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Stable — 95%</text>

  <rect x="140" y="132" width="180" height="38" rx="9" fill="url(#newv)" stroke="#16a34a" stroke-width="2" filter="url(#cbsh)"/>
  <text x="230" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Canary — 5%</text>

  <text x="190" y="200" text-anchor="middle" font-size="11" fill="#475569">Watch both. Healthy?</text>
  <text x="190" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">5% → 25% → 50% → 100%</text>
  <text x="190" y="236" text-anchor="middle" font-size="11" fill="#b91c1c">Degraded? route all back to stable</text>

  <rect x="60" y="256" width="260" height="56" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="190" y="277" text-anchor="middle" font-size="10.5" fill="#334155">Small blast radius · gradual rollback</text>
  <text x="190" y="295" text-anchor="middle" font-size="10.5" fill="#334155">Low extra cost · best for high traffic</text>

  <!-- ===== BLUE-GREEN (right) ===== -->
  <text x="570" y="68" text-anchor="middle" font-size="14" font-weight="800" fill="#0891b2">Blue-Green — instant flip</text>

  <circle cx="460" cy="120" r="22" fill="#e2e8f0"/><text x="460" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">users</text>
  <line x1="482" y1="118" x2="518" y2="101" stroke="#16a34a" stroke-width="3" marker-end="url(#cbah)"/>
  <text x="500" y="98" font-size="9" font-weight="700" fill="#16a34a">flip</text>

  <rect x="520" y="82" width="180" height="38" rx="9" fill="url(#newv)" stroke="#16a34a" stroke-width="2" filter="url(#cbsh)"/>
  <text x="610" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Green — new (live)</text>

  <rect x="520" y="132" width="180" height="38" rx="9" fill="url(#stable)" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" filter="url(#cbsh)"/>
  <text x="610" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Blue — old (standby)</text>

  <text x="570" y="200" text-anchor="middle" font-size="11" fill="#475569">All traffic flips at once.</text>
  <text x="570" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Rollback = flip back to blue</text>
  <text x="570" y="236" text-anchor="middle" font-size="11" fill="#b91c1c">All users exposed simultaneously</text>

  <rect x="440" y="256" width="260" height="56" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="570" y="277" text-anchor="middle" font-size="10.5" fill="#334155">Instant cutover · instant rollback</text>
  <text x="570" y="295" text-anchor="middle" font-size="10.5" fill="#334155">Higher cost (two full envs)</text>
</svg>
