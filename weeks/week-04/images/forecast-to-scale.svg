<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fsah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="fs1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="fs2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="fs3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="fs4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="fssh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="860" height="240" fill="#f8fafc"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">From a Prophet forecast to a scaling action (this week's lab)</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="206" y1="120" x2="226" y2="120" marker-end="url(#fsah)"/>
    <line x1="412" y1="120" x2="432" y2="120" marker-end="url(#fsah)"/>
    <line x1="618" y1="120" x2="638" y2="120" marker-end="url(#fsah)"/>
  </g>

  <rect x="26" y="78" width="180" height="84" rx="12" fill="url(#fs1)" stroke="#2563eb" stroke-width="2" filter="url(#fssh)"/>
  <text x="116" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1 · CPU history</text>
  <text x="116" y="130" text-anchor="middle" font-size="10.5" fill="#475569">time series (ds, y)</text>
  <text x="116" y="146" text-anchor="middle" font-size="10" fill="#64748b">5-min samples</text>

  <rect x="232" y="78" width="180" height="84" rx="12" fill="url(#fs2)" stroke="#4f46e5" stroke-width="2" filter="url(#fssh)"/>
  <text x="322" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">2 · Prophet</text>
  <text x="322" y="130" text-anchor="middle" font-size="10.5" fill="#475569">trend + seasonality</text>
  <text x="322" y="146" text-anchor="middle" font-size="10" fill="#64748b">forecast next 30 min</text>

  <rect x="438" y="78" width="180" height="84" rx="12" fill="url(#fs3)" stroke="#d97706" stroke-width="2" filter="url(#fssh)"/>
  <text x="528" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">3 · Replica calc</text>
  <text x="528" y="126" text-anchor="middle" font-size="9.5" fill="#475569">ceil(cur × cpû / target)</text>
  <text x="528" y="144" text-anchor="middle" font-size="10" fill="#64748b">clamp [min, max]</text>

  <rect x="644" y="78" width="190" height="84" rx="12" fill="url(#fs4)" stroke="#16a34a" stroke-width="2" filter="url(#fssh)"/>
  <text x="739" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">4 · Scale action</text>
  <text x="739" y="126" text-anchor="middle" font-size="10.5" fill="#475569">"scale 5 → 7 pods"</text>
  <text x="739" y="144" text-anchor="middle" font-size="10" fill="#64748b">pre-emptive</text>

  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#475569">Evaluate first: hold out the last 24 h, check MAE / MAPE. A MAPE under ~10% is good enough to act on.</text>
  <text x="430" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">Use the upper confidence bound when under-provisioning is costlier than over-provisioning.</text>
</svg>
