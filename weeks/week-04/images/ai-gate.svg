<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gtah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="gfeat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="gmodel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="gscore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="gtsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#f8fafc"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">An AI gate scores a canary, then decides</text>

  <!-- features -->
  <rect x="24" y="64" width="210" height="200" rx="12" fill="url(#gfeat)" stroke="#2563eb" stroke-width="2" filter="url(#gtsh)"/>
  <text x="129" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Features (live canary)</text>
  <text x="40" y="112" font-size="10.5" fill="#334155">• error-rate Δ vs stable</text>
  <text x="40" y="132" font-size="10.5" fill="#334155">• p99 latency Δ</text>
  <text x="40" y="152" font-size="10.5" fill="#334155">• CPU / memory increase</text>
  <text x="40" y="172" font-size="10.5" fill="#334155">• change volume (files, lines)</text>
  <text x="40" y="192" font-size="10.5" fill="#334155">• # dependent services</text>
  <text x="40" y="212" font-size="10.5" fill="#334155">• team historical fail rate</text>
  <text x="40" y="232" font-size="10.5" fill="#334155">• touched security files?</text>

  <line x1="234" y1="164" x2="270" y2="164" stroke="#6366f1" stroke-width="2.5" marker-end="url(#gtah)"/>

  <!-- model -->
  <rect x="272" y="120" width="190" height="88" rx="12" fill="url(#gmodel)" stroke="#4f46e5" stroke-width="2" filter="url(#gtsh)"/>
  <text x="367" y="156" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">Classifier</text>
  <text x="367" y="176" text-anchor="middle" font-size="10.5" fill="#475569">XGBoost / logistic</text>
  <text x="367" y="193" text-anchor="middle" font-size="10" fill="#64748b">trained on past deploys</text>

  <line x1="462" y1="164" x2="498" y2="164" stroke="#6366f1" stroke-width="2.5" marker-end="url(#gtah)"/>

  <!-- score -->
  <rect x="500" y="120" width="256" height="88" rx="12" fill="url(#gscore)" stroke="#d97706" stroke-width="2" filter="url(#gtsh)"/>
  <text x="628" y="152" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">"78% healthy"</text>
  <text x="628" y="174" text-anchor="middle" font-size="10.5" fill="#475569">below threshold (70%)?</text>
  <text x="628" y="191" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">→ recommend ABORT</text>

  <!-- autonomy dial -->
  <rect x="272" y="232" width="484" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="514" y="252" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">The autonomy dial — same score, three policies</text>
  <text x="290" y="274" font-size="10.5" fill="#16a34a">● in-loop: post to Slack, human approves</text>
  <text x="290" y="290" font-size="10.5" fill="#d97706">● on-loop: auto-abort unless overridden in 5 min</text>
  <text x="560" y="274" font-size="10.5" fill="#db2777">● autonomous: abort now,</text>
  <text x="560" y="290" font-size="10.5" fill="#db2777">  notify on-call after</text>
</svg>
