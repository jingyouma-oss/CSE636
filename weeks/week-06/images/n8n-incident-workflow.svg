<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/></marker>
    <marker id="nahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker>
    <marker id="nahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <linearGradient id="nsched" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="nhttp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="nif" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="nedit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="nagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="nheal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <linearGradient id="nmem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ccfbf1"/><stop offset="1" stop-color="#99f6e4"/></linearGradient>
    <linearGradient id="ntools" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
    <linearGradient id="nnotify" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <filter id="nsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">No-code incident-response agent (n8n)</text>

  <!-- lane labels -->
  <text x="20" y="49" font-size="10" font-weight="700" fill="#94a3b8">PERCEIVE → DECIDE</text>
  <text x="352" y="290" font-size="10" font-weight="700" fill="#94a3b8">THE AGENT'S BRAIN (attached below the AI Agent)</text>

  <!-- top flow arrows -->
  <g stroke="#4f46e5" stroke-width="2.5" fill="none">
    <line x1="140" y1="79" x2="168" y2="79" marker-end="url(#nah)"/>
    <line x1="308" y1="79" x2="336" y2="79" marker-end="url(#nah)"/>
    <line x1="456" y1="79" x2="488" y2="79" marker-end="url(#nah)"/>
    <line x1="396" y1="102" x2="396" y2="132" marker-end="url(#nah)"/>
    <line x1="563" y1="102" x2="563" y2="192" marker-end="url(#nah)"/>
  </g>
  <text x="472" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a">true</text>
  <text x="412" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">false</text>

  <!-- top flow boxes -->
  <rect x="20" y="56" width="120" height="46" rx="11" fill="url(#nsched)" stroke="#2563eb" stroke-width="2" filter="url(#nsh)"/>
  <text x="80" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">⏱ Schedule</text>
  <text x="80" y="91" text-anchor="middle" font-size="9.5" fill="#475569">every 5 min</text>

  <rect x="168" y="56" width="140" height="46" rx="11" fill="url(#nhttp)" stroke="#ea580c" stroke-width="2" filter="url(#nsh)"/>
  <text x="238" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">🌐 HTTP Request</text>
  <text x="238" y="91" text-anchor="middle" font-size="9.5" fill="#475569">query Prometheus</text>

  <rect x="336" y="56" width="120" height="46" rx="11" fill="url(#nif)" stroke="#d97706" stroke-width="2" filter="url(#nsh)"/>
  <text x="396" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">◇ If</text>
  <text x="396" y="91" text-anchor="middle" font-size="9.5" fill="#475569">alert firing?</text>

  <rect x="488" y="56" width="150" height="46" rx="11" fill="url(#nedit)" stroke="#7c3aed" stroke-width="2" filter="url(#nsh)"/>
  <text x="563" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">✎ Edit Fields</text>
  <text x="563" y="91" text-anchor="middle" font-size="9.5" fill="#475569">build incident prompt</text>

  <!-- healthy false branch -->
  <rect x="336" y="132" width="120" height="40" rx="10" fill="url(#nheal)" stroke="#16a34a" stroke-width="2" filter="url(#nsh)"/>
  <text x="396" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">✓ Record healthy</text>
  <text x="396" y="165" text-anchor="middle" font-size="9" fill="#475569">nothing to do</text>

  <!-- AI Agent -->
  <rect x="470" y="192" width="190" height="70" rx="13" fill="url(#nagent)" stroke="#4f46e5" stroke-width="2.5" filter="url(#nsh)"/>
  <text x="565" y="220" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">🤖 AI Agent</text>
  <text x="565" y="238" text-anchor="middle" font-size="10" fill="#334155">ReAct loop:</text>
  <text x="565" y="252" text-anchor="middle" font-size="10" fill="#334155">reason → tool → observe</text>

  <!-- notify (disabled) -->
  <rect x="690" y="200" width="118" height="58" rx="11" fill="url(#nnotify)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3" filter="url(#nsh)"/>
  <text x="749" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">📣 Notify</text>
  <text x="749" y="237" text-anchor="middle" font-size="9" fill="#64748b">Gmail · Telegram</text>
  <text x="749" y="250" text-anchor="middle" font-size="8.5" font-style="italic" fill="#94a3b8">(disabled)</text>
  <line x1="660" y1="229" x2="690" y2="229" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#nahg)"/>

  <!-- brain: attachment arrows (ai_ connections) -->
  <g stroke="#9333ea" stroke-width="2.5" fill="none">
    <line x1="427" y1="300" x2="515" y2="263" marker-end="url(#nahp)"/>
    <line x1="590" y1="300" x2="600" y2="263" marker-end="url(#nahp)"/>
    <line x1="720" y1="372" x2="645" y2="263" marker-end="url(#nahp)"/>
  </g>
  <text x="452" y="285" text-anchor="middle" font-size="8.5" fill="#7e22ce">model</text>
  <text x="618" y="285" text-anchor="middle" font-size="8.5" fill="#7e22ce">memory</text>
  <text x="700" y="352" text-anchor="middle" font-size="8.5" fill="#7e22ce">tools</text>

  <!-- model -->
  <rect x="352" y="300" width="150" height="48" rx="11" fill="url(#nedit)" stroke="#7c3aed" stroke-width="2" filter="url(#nsh)"/>
  <text x="427" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">🧠 Ollama Chat Model</text>
  <text x="427" y="336" text-anchor="middle" font-size="9" fill="#475569">local LLM (llama3.1)</text>

  <!-- memory -->
  <rect x="520" y="300" width="140" height="48" rx="11" fill="url(#nmem)" stroke="#0d9488" stroke-width="2" filter="url(#nsh)"/>
  <text x="590" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">💾 Simple Memory</text>
  <text x="590" y="336" text-anchor="middle" font-size="9" fill="#475569">custom session key</text>

  <!-- tools -->
  <rect x="352" y="372" width="440" height="156" rx="12" fill="url(#ntools)" stroke="#9333ea" stroke-width="2.5" filter="url(#nsh)"/>
  <text x="572" y="396" text-anchor="middle" font-size="12" font-weight="800" fill="#7e22ce">🛠 9 Tools — each an n8n Code node (mock)</text>
  <g font-size="10" fill="#334155">
    <text x="445" y="432" text-anchor="middle">Incident Analyzer</text>
    <text x="575" y="432" text-anchor="middle">Decision Router</text>
    <text x="705" y="432" text-anchor="middle" fill="#b45309" font-weight="700">🔒 Human Review</text>
    <text x="445" y="462" text-anchor="middle">Log Analyzer</text>
    <text x="575" y="462" text-anchor="middle">CD Analyzer</text>
    <text x="705" y="462" text-anchor="middle">Deal Action</text>
    <text x="445" y="492" text-anchor="middle">Reporter Tool</text>
    <text x="575" y="492" text-anchor="middle" fill="#b91c1c" font-weight="700">⚠ Docker Restart</text>
    <text x="705" y="492" text-anchor="middle" fill="#b45309" font-weight="700">🔒 Approval</text>
  </g>
  <text x="572" y="517" text-anchor="middle" font-size="8.5" fill="#64748b">🔒 = human-in-the-loop gate · ⚠ = destructive, requires approval first</text>

  <text x="410" y="548" text-anchor="middle" font-size="10.5" fill="#64748b">Schedule → check Prometheus → if an alert is firing, the agent triages with a model, memory, and 9 tools — destructive actions stay behind a human gate.</text>
</svg>
