<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="itah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="itg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="italert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="itagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="itgreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <linearGradient id="ityellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="itsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="470" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Agent ↔ ITSM: file, diagnose, then resolve or escalate</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="320" y1="62" x2="320" y2="80" marker-end="url(#itah)"/>
    <line x1="320" y1="130" x2="320" y2="148" marker-end="url(#itah)"/>
    <line x1="320" y1="198" x2="320" y2="216" marker-end="url(#itah)"/>
  </g>

  <rect x="200" y="40" width="240" height="22" rx="10" fill="url(#italert)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Alert fires</text>

  <rect x="150" y="82" width="340" height="48" rx="11" fill="url(#itagent)" stroke="#4f46e5" stroke-width="2" filter="url(#itsh)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" font-weight="800" fill="#4338ca">Agent correlates → creates 1 PagerDuty incident</text>
  <text x="320" y="121" text-anchor="middle" font-size="9.5" fill="#475569">(not one per downstream service)</text>

  <rect x="150" y="150" width="340" height="48" rx="11" fill="url(#itagent)" stroke="#4f46e5" stroke-width="2" filter="url(#itsh)"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#4338ca">Agent executes runbook diagnostics</text>
  <text x="320" y="189" text-anchor="middle" font-size="9.5" fill="#475569">tool calls: logs, metrics, deploy history</text>

  <!-- branch -->
  <text x="320" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">resolved automatically?</text>

  <line x1="250" y1="244" x2="170" y2="280" stroke="#16a34a" stroke-width="2.5" marker-end="url(#itg)"/>
  <text x="150" y="266" font-size="9" font-weight="700" fill="#15803d">yes</text>
  <line x1="390" y1="244" x2="470" y2="280" stroke="#d97706" stroke-width="2.5" marker-end="url(#ity)"/>
  <text x="476" y="266" font-size="9" font-weight="700" fill="#b45309">needs human</text>

  <!-- auto-resolved branch -->
  <rect x="40" y="282" width="250" height="70" rx="11" fill="url(#itgreen)" stroke="#16a34a" stroke-width="2" filter="url(#itsh)"/>
  <text x="165" y="306" text-anchor="middle" font-size="11.5" font-weight="800" fill="#15803d">Auto-resolved</text>
  <text x="165" y="325" text-anchor="middle" font-size="9.5" fill="#334155">resolve incident · post timeline</text>
  <text x="165" y="339" text-anchor="middle" font-size="9.5" fill="#334155">+ draft postmortem</text>

  <!-- escalate branch -->
  <rect x="350" y="282" width="250" height="70" rx="11" fill="url(#ityellow)" stroke="#d97706" stroke-width="2" filter="url(#itsh)"/>
  <text x="475" y="306" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b45309">Escalate to on-call</text>
  <text x="475" y="325" text-anchor="middle" font-size="9.5" fill="#334155">send rich summary; human approves</text>
  <text x="475" y="339" text-anchor="middle" font-size="9.5" fill="#334155">or takes over</text>

  <!-- converge to postmortem feedback -->
  <line x1="165" y1="352" x2="300" y2="392" stroke="#6366f1" stroke-width="2" marker-end="url(#itah)"/>
  <line x1="475" y1="352" x2="340" y2="392" stroke="#6366f1" stroke-width="2" marker-end="url(#itah)"/>
  <rect x="170" y="394" width="300" height="56" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="320" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Postmortem → action items</text>
  <text x="320" y="434" text-anchor="middle" font-size="9.5" fill="#475569">feed runbook updates, tests, thresholds (the feedback loop)</text>
</svg>
