<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="acah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="acstorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="acagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="acinc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="acsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#f8fafc"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">One root cause, 150 pages → the agent makes it 1</text>

  <!-- storm of alerts (left) -->
  <text x="140" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Alert storm</text>
  <g font-size="9.5" fill="#0f172a">
    <rect x="30" y="74" width="220" height="26" rx="6" fill="url(#acstorm)" stroke="#dc2626" stroke-width="1"/><text x="42" y="91">payment-svc: error rate 15%</text>
    <rect x="30" y="106" width="220" height="26" rx="6" fill="url(#acstorm)" stroke="#dc2626" stroke-width="1"/><text x="42" y="123">cart-svc: p99 latency 3200ms</text>
    <rect x="30" y="138" width="220" height="26" rx="6" fill="url(#acstorm)" stroke="#dc2626" stroke-width="1"/><text x="42" y="155">checkout-svc: db timeout</text>
    <rect x="30" y="170" width="220" height="26" rx="6" fill="url(#acstorm)" stroke="#dc2626" stroke-width="1"/><text x="42" y="187">order-history: conn refused</text>
    <rect x="30" y="202" width="220" height="26" rx="6" fill="url(#acstorm)" stroke="#dc2626" stroke-width="1" opacity="0.6"/><text x="42" y="219" fill="#7f1d1d">…146 more</text>
  </g>

  <line x1="252" y1="150" x2="296" y2="150" stroke="#6366f1" stroke-width="2.5" marker-end="url(#acah)"/>

  <!-- agent -->
  <rect x="300" y="104" width="180" height="96" rx="12" fill="url(#acagent)" stroke="#4f46e5" stroke-width="2.5" filter="url(#acsh)"/>
  <text x="390" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4338ca">Correlation agent</text>
  <text x="390" y="150" text-anchor="middle" font-size="9.5" fill="#475569">all four depend on</text>
  <text x="390" y="164" text-anchor="middle" font-size="9.5" fill="#475569">postgres-primary; one</text>
  <text x="390" y="178" text-anchor="middle" font-size="9.5" fill="#475569">says "connection refused"</text>
  <text x="390" y="194" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">→ shared root cause</text>

  <line x1="482" y1="150" x2="526" y2="150" stroke="#6366f1" stroke-width="2.5" marker-end="url(#acah)"/>

  <!-- single incident -->
  <rect x="530" y="104" width="220" height="96" rx="12" fill="url(#acinc)" stroke="#16a34a" stroke-width="2.5" filter="url(#acsh)"/>
  <text x="640" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#15803d">1 incident</text>
  <text x="640" y="150" text-anchor="middle" font-size="9.5" fill="#334155">"postgres-primary</text>
  <text x="640" y="164" text-anchor="middle" font-size="9.5" fill="#334155">connectivity failure"</text>
  <text x="640" y="182" text-anchor="middle" font-size="9" fill="#475569">downstream alerts suppressed;</text>
  <text x="640" y="194" text-anchor="middle" font-size="9" fill="#475569">triage runbook begins</text>

  <text x="390" y="262" text-anchor="middle" font-size="12" fill="#475569">The on-call engineer gets <tspan font-weight="700" fill="#15803d">one</tspan> actionable incident with a clear starting point,</text>
  <text x="390" y="282" text-anchor="middle" font-size="12" fill="#475569">instead of 150 pages that are all symptoms of the same failure.</text>
</svg>
