<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="iaah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="iainc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="iamcp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="iaagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="iagate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="iadone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="iash" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">What you'll build: a gated incident-triage agent</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="340" y1="58" x2="340" y2="76" marker-end="url(#iaah)"/>
    <line x1="340" y1="300" x2="340" y2="320" marker-end="url(#iaah)"/>
    <line x1="340" y1="364" x2="340" y2="384" marker-end="url(#iaah)"/>
  </g>

  <rect x="210" y="38" width="260" height="20" rx="10" fill="url(#iainc)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Simulated incident event</text>

  <!-- MCP + agent paired (two-way) -->
  <rect x="60" y="80" width="250" height="150" rx="12" fill="url(#iamcp)" stroke="#7c3aed" stroke-width="2.5" filter="url(#iash)"/>
  <text x="185" y="104" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d28d9">MCP Server</text>
  <text x="185" y="120" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">incident_tools_server.py</text>
  <text x="76" y="142" font-size="9.5" fill="#334155">exposes tools:</text>
  <text x="76" y="159" font-size="9" fill="#475569">• get_metrics · get_logs</text>
  <text x="76" y="174" font-size="9" fill="#475569">• get_deployment_history</text>
  <text x="76" y="189" font-size="9" fill="#475569">• dry_run_rollback</text>
  <text x="76" y="204" font-size="9" fill="#475569">• execute_rollback</text>
  <text x="76" y="219" font-size="9" fill="#475569">• create/resolve_pd_incident</text>

  <rect x="370" y="80" width="250" height="150" rx="12" fill="url(#iaagent)" stroke="#4f46e5" stroke-width="2.5" filter="url(#iash)"/>
  <text x="495" y="104" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4338ca">Python Agent</text>
  <text x="495" y="120" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">react_agent.py</text>
  <text x="495" y="150" text-anchor="middle" font-size="10.5" fill="#334155">ReAct loop:</text>
  <text x="495" y="168" text-anchor="middle" font-size="10.5" fill="#334155">reason → call tool</text>
  <text x="495" y="184" text-anchor="middle" font-size="10.5" fill="#334155">→ observe → repeat</text>

  <!-- two-way tool calls -->
  <line x1="312" y1="145" x2="368" y2="145" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#iaah)"/>
  <line x1="368" y1="170" x2="312" y2="170" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#iaah)"/>
  <text x="340" y="135" text-anchor="middle" font-size="8.5" fill="#6d28d9">tool calls</text>
  <text x="340" y="190" text-anchor="middle" font-size="8.5" fill="#6d28d9">results</text>

  <!-- approval gate -->
  <rect x="170" y="322" width="340" height="42" rx="11" fill="url(#iagate)" stroke="#d97706" stroke-width="2.5" filter="url(#iash)"/>
  <text x="340" y="341" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">🔒 Approval gate</text>
  <text x="340" y="357" text-anchor="middle" font-size="9.5" fill="#475569">terminal input simulating a Slack confirm</text>

  <!-- remediation -->
  <rect x="150" y="386" width="380" height="40" rx="11" fill="url(#iadone)" stroke="#16a34a" stroke-width="2" filter="url(#iash)"/>
  <text x="340" y="411" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Remediation executed (or escalated) → console postmortem</text>

  <text x="340" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">The agent reasons and proposes; the gate ensures a human approves before anything irreversible runs.</text>
</svg>
