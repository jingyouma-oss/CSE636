<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="shah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="shobs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="shint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="shagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="shk8s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="shhuman" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="shsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">The agentic layer sits between sensing and acting</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="360" y1="92" x2="360" y2="112" marker-end="url(#shah)"/>
    <line x1="360" y1="168" x2="360" y2="188" marker-end="url(#shah)"/>
  </g>

  <!-- observability -->
  <rect x="120" y="48" width="480" height="44" rx="11" fill="url(#shobs)" stroke="#2563eb" stroke-width="2" filter="url(#shsh)"/>
  <text x="360" y="68" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Observability layer (Week 5)</text>
  <text x="360" y="84" text-anchor="middle" font-size="10" fill="#475569">Metrics (Prometheus) + Logs (Loki) + Traces (Tempo)</text>
  <text x="372" y="106" font-size="9" fill="#64748b">alert / anomaly signal</text>

  <!-- intake -->
  <rect x="120" y="124" width="480" height="44" rx="11" fill="url(#shint)" stroke="#0891b2" stroke-width="2" filter="url(#shsh)"/>
  <text x="360" y="144" text-anchor="middle" font-size="13" font-weight="800" fill="#0e7490">Incident intake</text>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="#475569">alert manager → de-duplicate → correlate → enrich</text>
  <text x="372" y="182" font-size="9" fill="#64748b">structured incident context</text>

  <!-- agentic layer (highlighted) -->
  <rect x="120" y="200" width="480" height="74" rx="12" fill="url(#shagent)" stroke="#4f46e5" stroke-width="3" filter="url(#shsh)"/>
  <text x="360" y="224" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4338ca">Agentic SRE layer  ★ NEW this week</text>
  <text x="360" y="244" text-anchor="middle" font-size="10.5" fill="#334155">LLM agent ←→ MCP tools (kubectl, runbooks, ITSM)</text>
  <text x="360" y="261" text-anchor="middle" font-size="10.5" fill="#334155">ReAct loop + guardrails + approval gate</text>

  <!-- two outputs -->
  <line x1="250" y1="274" x2="210" y2="320" stroke="#16a34a" stroke-width="2.5" marker-end="url(#shah)"/>
  <text x="190" y="300" font-size="9" fill="#15803d">safe action</text>
  <line x1="470" y1="274" x2="510" y2="320" stroke="#d97706" stroke-width="2.5" marker-end="url(#shah)"/>
  <text x="512" y="300" font-size="9" fill="#b45309">needs approval</text>

  <rect x="70" y="322" width="280" height="56" rx="11" fill="url(#shk8s)" stroke="#16a34a" stroke-width="2" filter="url(#shsh)"/>
  <text x="210" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Kubernetes / Cloud API</text>
  <text x="210" y="364" text-anchor="middle" font-size="10" fill="#475569">reversible actions auto-execute (L3)</text>

  <rect x="370" y="322" width="280" height="56" rx="11" fill="url(#shhuman)" stroke="#d97706" stroke-width="2" filter="url(#shsh)"/>
  <text x="510" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Human on-call (PagerDuty)</text>
  <text x="510" y="364" text-anchor="middle" font-size="10" fill="#475569">irreversible actions wait for approval (L2)</text>

  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#64748b">It reasons — but it does not have unbounded permission to act.</text>
</svg>
