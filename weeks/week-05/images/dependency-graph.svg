<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dgah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="dgok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="dgnorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="dgsym" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#fdba74"/></linearGradient>
    <linearGradient id="dgroot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
    <filter id="dgsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Follow the errors upstream to the root cause</text>

  <!-- nodes left to right: frontend -> checkout -> payment -> db -->
  <rect x="36" y="120" width="130" height="56" rx="11" fill="url(#dgnorm)" stroke="#2563eb" stroke-width="2" filter="url(#dgsh)"/>
  <text x="101" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">frontend</text>
  <text x="101" y="163" text-anchor="middle" font-size="9.5" fill="#15803d">errors 0.2% ✓</text>

  <rect x="206" y="120" width="130" height="56" rx="11" fill="url(#dgsym)" stroke="#ea580c" stroke-width="2" filter="url(#dgsh)"/>
  <text x="271" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">checkout</text>
  <text x="271" y="163" text-anchor="middle" font-size="9.5" fill="#b45309">errors 4% ⚠ symptom</text>

  <rect x="376" y="120" width="130" height="56" rx="11" fill="url(#dgsym)" stroke="#ea580c" stroke-width="2" filter="url(#dgsh)"/>
  <text x="441" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">payment</text>
  <text x="441" y="163" text-anchor="middle" font-size="9.5" fill="#b45309">errors 4% ⚠ symptom</text>

  <rect x="546" y="120" width="138" height="56" rx="11" fill="url(#dgroot)" stroke="#dc2626" stroke-width="2.5" filter="url(#dgsh)"/>
  <text x="615" y="146" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d">postgres-db</text>
  <text x="615" y="163" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">ROOT CAUSE ✗</text>

  <!-- edges (calls) -->
  <line x1="166" y1="148" x2="204" y2="148" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgok)"/>
  <line x1="336" y1="148" x2="374" y2="148" stroke="#dc2626" stroke-width="3" marker-end="url(#dgah)"/>
  <line x1="506" y1="148" x2="544" y2="148" stroke="#dc2626" stroke-width="3" marker-end="url(#dgah)"/>

  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#475569">checkout and payment both show 4% errors — but their errors only began</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#475569">when <tspan font-weight="700" fill="#b91c1c">postgres-db</tspan> failed. The node with high errors and <tspan font-style="italic">no failing upstream</tspan> is the root.</text>

  <rect x="120" y="256" width="480" height="56" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="360" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Rule of thumb for RCA on a dependency graph</text>
  <text x="360" y="297" text-anchor="middle" font-size="10.5" fill="#334155">high error rate + no upstream also erroring → likely the cause, not a symptom</text>
</svg>
