<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rpah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="rtrig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="rgather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="rcorr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="rimp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="rrep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="rgate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="rpsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="500" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Agentic RCA — the perceive→plan→act→observe loop, applied</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="320" y1="70" x2="320" y2="88" marker-end="url(#rpah)"/>
    <line x1="320" y1="150" x2="320" y2="168" marker-end="url(#rpah)"/>
    <line x1="320" y1="222" x2="320" y2="240" marker-end="url(#rpah)"/>
    <line x1="320" y1="312" x2="320" y2="330" marker-end="url(#rpah)"/>
    <line x1="320" y1="402" x2="320" y2="420" marker-end="url(#rpah)"/>
  </g>

  <rect x="170" y="44" width="300" height="26" rx="10" fill="url(#rtrig)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">TRIGGER · anomaly alert fired (Week 5 detector)</text>

  <rect x="120" y="90" width="400" height="60" rx="11" fill="url(#rgather)" stroke="#2563eb" stroke-width="2" filter="url(#rpsh)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">1 · Gather context (agent uses tools)</text>
  <text x="320" y="131" text-anchor="middle" font-size="9.5" fill="#475569">metrics · logs · recent deployments · dependency graph</text>
  <text x="320" y="145" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">perceive</text>

  <rect x="140" y="170" width="360" height="52" rx="11" fill="url(#rcorr)" stroke="#4f46e5" stroke-width="2" filter="url(#rpsh)"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" font-weight="800" fill="#4338ca">2 · Correlate (LLM reasoning)</text>
  <text x="320" y="210" text-anchor="middle" font-size="9.5" fill="#475569">candidate root causes, each citing evidence · plan</text>

  <rect x="140" y="242" width="360" height="52" rx="11" fill="url(#rimp)" stroke="#d97706" stroke-width="2" filter="url(#rpsh)"/>
  <text x="320" y="264" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">3 · Assess impact</text>
  <text x="320" y="282" text-anchor="middle" font-size="9.5" fill="#475569">SLO burn rate · affected users · severity</text>

  <rect x="140" y="332" width="360" height="52" rx="11" fill="url(#rrep)" stroke="#0891b2" stroke-width="2" filter="url(#rpsh)"/>
  <text x="320" y="354" text-anchor="middle" font-size="12" font-weight="800" fill="#0e7490">4 · Generate structured report</text>
  <text x="320" y="372" text-anchor="middle" font-size="9.5" fill="#475569">Markdown RCA draft + log excerpts &amp; trace IDs · act</text>

  <rect x="150" y="422" width="340" height="58" rx="11" fill="url(#rgate)" stroke="#16a34a" stroke-width="2.5" filter="url(#rpsh)"/>
  <text x="320" y="445" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">5 · Human review gate</text>
  <text x="320" y="463" text-anchor="middle" font-size="9.5" fill="#475569">on-call reviews, edits, approves — stays on the loop</text>

  <text x="556" y="262" font-size="9" fill="#94a3b8" transform="rotate(90 556 262)">observe &amp; repeat</text>
</svg>
