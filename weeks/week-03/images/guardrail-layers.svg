<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  </defs>

  <rect x="0" y="0" width="700" height="380" fill="#f8fafc"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Guardrails are concentric fences, not one gate</text>

  <!-- outer: token permissions -->
  <rect x="40" y="48" width="620" height="300" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#glsh)"/>
  <text x="350" y="70" text-anchor="middle" font-size="12.5" font-weight="800" fill="#991b1b">① Token permissions — agent cannot push to main</text>

  <!-- middle: CODEOWNERS + branch protection -->
  <rect x="90" y="86" width="520" height="248" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="350" y="108" text-anchor="middle" font-size="12.5" font-weight="800" fill="#9a3412">② CODEOWNERS + branch-protection rules</text>

  <!-- inner: system prompt scope -->
  <rect x="140" y="124" width="420" height="196" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="146" text-anchor="middle" font-size="12.5" font-weight="800" fill="#854d0e">③ Agent system-prompt scope restriction</text>

  <!-- approval gate -->
  <rect x="190" y="162" width="320" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="350" y="184" text-anchor="middle" font-size="12.5" font-weight="800" fill="#15803d">④ Approval gate</text>

  <!-- the action at the core -->
  <rect x="240" y="200" width="220" height="86" rx="10" fill="#0f172a"/>
  <text x="350" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Agent action</text>
  <text x="350" y="252" text-anchor="middle" font-size="10.5" fill="#94a3b8">e.g. merge a proposed fix</text>
  <text x="350" y="272" text-anchor="middle" font-size="10" fill="#64748b">human reviews before this runs</text>

  <text x="350" y="366" text-anchor="middle" font-size="11" fill="#475569">Outer fences catch mistakes even if an inner one fails. No single layer is trusted alone.</text>
</svg>
