<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <linearGradient id="t6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="tsh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="860" height="280" fill="#f8fafc"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Build-triage agent: find the fire, propose the fix — but never merge</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="146" y1="120" x2="166" y2="120" marker-end="url(#tah3)"/>
    <line x1="282" y1="120" x2="302" y2="120" marker-end="url(#tah3)"/>
    <line x1="418" y1="120" x2="438" y2="120" marker-end="url(#tah3)"/>
    <line x1="554" y1="120" x2="574" y2="120" marker-end="url(#tah3)"/>
    <line x1="690" y1="120" x2="710" y2="120" marker-end="url(#tah3)"/>
  </g>

  <rect x="20"  y="86" width="126" height="68" rx="11" fill="url(#t1)" stroke="#dc2626" stroke-width="2" filter="url(#tsh3)"/>
  <text x="83" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1 · Failure</text>
  <text x="83" y="133" text-anchor="middle" font-size="10" fill="#475569">red build signal</text>

  <rect x="166" y="86" width="126" height="68" rx="11" fill="url(#t2)" stroke="#2563eb" stroke-width="2" filter="url(#tsh3)"/>
  <text x="229" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2 · Collect</text>
  <text x="229" y="133" text-anchor="middle" font-size="10" fill="#475569">logs · diff · history</text>

  <rect x="302" y="86" width="126" height="68" rx="11" fill="url(#t3)" stroke="#4f46e5" stroke-width="2" filter="url(#tsh3)"/>
  <text x="365" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">3 · Reason</text>
  <text x="365" y="133" text-anchor="middle" font-size="10" fill="#475569">find root cause</text>

  <rect x="438" y="86" width="126" height="68" rx="11" fill="url(#t4)" stroke="#7c3aed" stroke-width="2" filter="url(#tsh3)"/>
  <text x="501" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">4 · Propose</text>
  <text x="501" y="133" text-anchor="middle" font-size="10" fill="#475569">minimal fix</text>

  <rect x="574" y="86" width="126" height="68" rx="11" fill="url(#t5)" stroke="#db2777" stroke-width="2" filter="url(#tsh3)"/>
  <text x="637" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">5 · Open PR</text>
  <text x="637" y="133" text-anchor="middle" font-size="10" fill="#475569">PR-scope token</text>

  <rect x="710" y="86" width="130" height="68" rx="11" fill="url(#t6)" stroke="#d97706" stroke-width="2" filter="url(#tsh3)"/>
  <text x="775" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">6 · Wait</text>
  <text x="775" y="133" text-anchor="middle" font-size="10" fill="#475569">human approves</text>

  <!-- guardrail callout -->
  <rect x="574" y="186" width="266" height="58" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="707" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">🔒 The token has pull_request:write only</text>
  <text x="707" y="227" text-anchor="middle" font-size="10.5" fill="#9a3412">It cannot push to main, delete branches, or deploy.</text>

  <text x="280" y="216" text-anchor="middle" font-size="11.5" fill="#475569">Steps 1–4 turn "47 failing steps, find it yourself"</text>
  <text x="280" y="233" text-anchor="middle" font-size="11.5" fill="#475569">into a reasoned diagnosis in minutes.</text>
</svg>
