<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="ga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="ga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="ga3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <filter id="ash" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="860" height="360" fill="#f8fafc"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Jenkins architecture: the controller decides WHAT, the agent decides WHERE / HOW</text>

  <!-- developer -->
  <rect x="24" y="150" width="120" height="66" rx="11" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#ash)"/>
  <text x="84" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Developer</text>
  <text x="84" y="199" text-anchor="middle" font-size="10" fill="#475569">git push / PR</text>

  <!-- controller -->
  <rect x="220" y="120" width="180" height="126" rx="13" fill="url(#ga1)" stroke="#2563eb" stroke-width="2.5" filter="url(#ash)"/>
  <text x="310" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Controller (Master)</text>
  <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#334155">UI &amp; job scheduling</text>
  <text x="310" y="190" text-anchor="middle" font-size="10.5" fill="#334155">credentials &amp; secrets</text>
  <text x="310" y="208" text-anchor="middle" font-size="10.5" fill="#334155">reads the Jenkinsfile</text>
  <text x="310" y="230" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1e3a8a">picks an agent by label</text>

  <!-- agents -->
  <rect x="480" y="70" width="180" height="72" rx="12" fill="url(#ga2)" stroke="#4f46e5" stroke-width="2" filter="url(#ash)"/>
  <text x="570" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Agent · label: docker</text>
  <text x="570" y="117" text-anchor="middle" font-size="10" fill="#475569">git · npm · docker build</text>
  <text x="570" y="132" text-anchor="middle" font-size="10" fill="#475569">runs the actual steps</text>

  <rect x="480" y="160" width="180" height="72" rx="12" fill="url(#ga2)" stroke="#4f46e5" stroke-width="2" filter="url(#ash)"/>
  <text x="570" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Agent · label: terraform</text>
  <text x="570" y="207" text-anchor="middle" font-size="10" fill="#475569">plan · apply (scoped creds)</text>
  <text x="570" y="222" text-anchor="middle" font-size="10" fill="#475569">isolated workspace</text>

  <rect x="480" y="250" width="180" height="72" rx="12" fill="url(#ga2)" stroke="#4f46e5" stroke-width="2" filter="url(#ash)"/>
  <text x="570" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Agent · label: mac</text>
  <text x="570" y="297" text-anchor="middle" font-size="10" fill="#475569">iOS / macOS builds</text>
  <text x="570" y="312" text-anchor="middle" font-size="10" fill="#475569">different OS &amp; arch</text>

  <!-- results -->
  <rect x="716" y="160" width="120" height="72" rx="11" fill="url(#ga3)" stroke="#16a34a" stroke-width="2" filter="url(#ash)"/>
  <text x="776" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Results</text>
  <text x="776" y="209" text-anchor="middle" font-size="10" fill="#475569">logs · status</text>
  <text x="776" y="223" text-anchor="middle" font-size="10" fill="#475569">artifacts</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="144" y1="183" x2="216" y2="183" marker-end="url(#ah)"/>
    <line x1="400" y1="150" x2="476" y2="106" marker-end="url(#ah)"/>
    <line x1="400" y1="183" x2="476" y2="196" marker-end="url(#ah)"/>
    <line x1="400" y1="216" x2="476" y2="286" marker-end="url(#ah)"/>
    <line x1="660" y1="196" x2="712" y2="196" marker-end="url(#ah)"/>
  </g>
  <text x="623" y="248" text-anchor="middle" font-size="9.5" fill="#64748b">agent reports back →</text>

  <text x="430" y="348" text-anchor="middle" font-size="11" fill="#475569">One controller orchestrates many agents. Never run heavy builds on the controller itself.</text>
</svg>
