<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="pcommit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="ppred" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="psel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="psh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="680" height="330" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ML sizes the build to the change</text>

  <g stroke="#16a34a" stroke-width="2.5" fill="none">
    <line x1="340" y1="74" x2="340" y2="96" marker-end="url(#pah)"/>
    <line x1="340" y1="196" x2="340" y2="218" marker-end="url(#pah)"/>
  </g>

  <!-- commit -->
  <rect x="200" y="44" width="280" height="30" rx="10" fill="url(#pcommit)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">New commit: only docs/ changed</text>

  <!-- resource predictor -->
  <rect x="150" y="98" width="380" height="98" rx="12" fill="url(#ppred)" stroke="#16a34a" stroke-width="2" filter="url(#psh)"/>
  <text x="340" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">Resource-predictor model</text>
  <text x="170" y="146" font-size="11" fill="#334155">→ predicted build time: 2 min</text>
  <text x="170" y="166" font-size="11" fill="#334155">→ predicted CPU need: 1 vCPU</text>
  <text x="170" y="186" font-size="11" fill="#334155">→ provision: t3.micro runner (not a 32-vCPU box)</text>

  <!-- selective execution -->
  <rect x="150" y="220" width="380" height="84" rx="12" fill="url(#psel)" stroke="#d97706" stroke-width="2" filter="url(#psh)"/>
  <text x="340" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">Selective-execution model</text>
  <text x="170" y="268" font-size="11" fill="#b91c1c">✗ skip: frontend &amp; backend test suites</text>
  <text x="170" y="288" font-size="11" fill="#15803d">✓ run: markdown lint only</text>

  <text x="600" y="150" font-size="10.5" font-weight="700" fill="#15803d" transform="rotate(90 600 150)">right-size compute</text>
  <text x="600" y="262" font-size="10.5" font-weight="700" fill="#b45309" transform="rotate(90 600 262)">skip the irrelevant</text>
</svg>
