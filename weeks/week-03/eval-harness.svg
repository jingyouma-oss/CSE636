<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="eah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="ecommit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="eagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="eharness" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="egate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <filter id="esh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="470" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">An agent can't grade its own homework</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="320" y1="78" x2="320" y2="100" marker-end="url(#eah)"/>
    <line x1="320" y1="186" x2="320" y2="208" marker-end="url(#eah)"/>
    <line x1="320" y1="330" x2="320" y2="352" marker-end="url(#eah)"/>
  </g>

  <!-- commit -->
  <rect x="180" y="48" width="280" height="30" rx="10" fill="url(#ecommit)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Developer commits a code change</text>
  <text x="468" y="96" font-size="10" fill="#64748b">triggers</text>

  <!-- Agent A -->
  <rect x="120" y="102" width="400" height="84" rx="12" fill="url(#eagent)" stroke="#4f46e5" stroke-width="2" filter="url(#esh3)"/>
  <text x="320" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">Agent A · Test-Generation Agent</text>
  <text x="320" y="148" text-anchor="middle" font-size="11" fill="#334155">reads the changed functions →</text>
  <text x="320" y="166" text-anchor="middle" font-size="11" fill="#334155">writes tests/generated/test_payment.py</text>
  <text x="372" y="204" font-size="10" fill="#64748b">generated tests feed into</text>

  <!-- Eval harness -->
  <rect x="90" y="210" width="460" height="120" rx="12" fill="url(#eharness)" stroke="#0891b2" stroke-width="2.5" filter="url(#esh3)"/>
  <text x="320" y="234" text-anchor="middle" font-size="13" font-weight="800" fill="#0e7490">Eval Harness · independently maintained</text>
  <text x="112" y="258" font-size="11" fill="#334155">• contract tests (OpenAPI assertions)</text>
  <text x="112" y="278" font-size="11" fill="#334155">• property-based fuzzing (Hypothesis)</text>
  <text x="112" y="298" font-size="11" fill="#334155">• golden-output regression tests</text>
  <text x="112" y="318" font-size="11" fill="#b91c1c">• detects trivially-true / always-pass tests</text>
  <text x="360" y="350" font-size="10" fill="#64748b">eval score feeds into</text>

  <!-- Human gate -->
  <rect x="150" y="354" width="340" height="64" rx="12" fill="url(#egate)" stroke="#d97706" stroke-width="2" filter="url(#esh3)"/>
  <text x="320" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Human approval gate</text>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#475569">required if eval score &lt; threshold</text>

  <text x="320" y="446" text-anchor="middle" font-size="11" fill="#64748b">The harness is NOT written by the agent it checks — that independence is the whole point.</text>
</svg>
