<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="fpush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="ffail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="fagent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="fgate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="fgreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="fsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="500" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">What you'll build this lab</text>

  <g stroke="#6366f1" stroke-width="2.5" fill="none">
    <line x1="320" y1="78" x2="320" y2="98" marker-end="url(#fah)"/>
    <line x1="320" y1="146" x2="320" y2="166" marker-end="url(#fah)"/>
    <line x1="320" y1="258" x2="320" y2="278" marker-end="url(#fah)"/>
    <line x1="320" y1="358" x2="320" y2="378" marker-end="url(#fah)"/>
    <line x1="320" y1="430" x2="320" y2="450" marker-end="url(#fah)"/>
  </g>

  <rect x="170" y="48" width="300" height="30" rx="10" fill="url(#fpush)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Push code with an intentional bug</text>

  <rect x="170" y="100" width="300" height="46" rx="11" fill="url(#ffail)" stroke="#dc2626" stroke-width="2" filter="url(#fsh)"/>
  <text x="320" y="121" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">CI pipeline runs → test stage FAILS ❌</text>
  <text x="320" y="138" text-anchor="middle" font-size="10" fill="#475569">continue-on-error lets the agent run next</text>

  <rect x="120" y="168" width="400" height="90" rx="12" fill="url(#fagent)" stroke="#4f46e5" stroke-width="2.5" filter="url(#fsh)"/>
  <text x="320" y="190" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">Build-fixer agent activates</text>
  <text x="140" y="212" font-size="10.5" fill="#334155">→ reads the build log · identifies the failing test &amp; cause</text>
  <text x="140" y="230" font-size="10.5" fill="#334155">→ proposes a minimal fix</text>
  <text x="140" y="248" font-size="10.5" fill="#b91c1c">→ opens a PR (write only — NO merge permission)</text>

  <rect x="150" y="280" width="340" height="78" rx="12" fill="url(#fgate)" stroke="#d97706" stroke-width="2.5" filter="url(#fsh)"/>
  <text x="320" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">🔒 Human approval gate (pauses here)</text>
  <text x="320" y="324" text-anchor="middle" font-size="10.5" fill="#475569">teammate reviews the PR, then clicks Approve</text>
  <text x="320" y="342" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">times out to ABORT — never auto-approves</text>

  <rect x="170" y="380" width="300" height="50" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">(optional) auto-merge to a feature branch</text>
  <text x="320" y="418" text-anchor="middle" font-size="10" fill="#64748b">never to main</text>

  <rect x="190" y="452" width="260" height="40" rx="11" fill="url(#fgreen)" stroke="#16a34a" stroke-width="2" filter="url(#fsh)"/>
  <text x="320" y="477" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Green pipeline confirms the fix ✅</text>
</svg>
