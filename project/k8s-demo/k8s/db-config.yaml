apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: k8s-demo
data:
  POSTGRES_DB: appdb
  POSTGRES_USER: appuser
  init.sql: |
    CREATE TABLE IF NOT EXISTS items (
        id   SERIAL PRIMARY KEY,
        name TEXT NOT NULL
    );

    INSERT INTO items (name) VALUES
        ('hello from postgres'),
        ('three-tier on kubernetes');
