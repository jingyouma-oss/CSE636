apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: k8s-demo-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-config
