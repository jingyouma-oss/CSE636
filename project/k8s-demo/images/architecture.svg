<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="system-ui, sans-serif" role="img" aria-label="Three-tier architecture on a local single-node Kubernetes (Docker Desktop or Rancher Desktop)">
  <defs>
    <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="be" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae8ff"/><stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">3-Tier App on Local Kubernetes (Docker Desktop / Rancher Desktop)</text>

  <!-- Browser -->
  <rect x="24" y="210" width="130" height="90" rx="12" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
  <text x="89" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Your Mac</text>
  <text x="89" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">browser</text>
  <text x="89" y="288" text-anchor="middle" font-size="11" fill="#475569">localhost:30080</text>

  <!-- Namespace boundary -->
  <rect x="190" y="60" width="730" height="430" rx="16" fill="none" stroke="#94a3b8" stroke-dasharray="8 6"/>
  <text x="206" y="84" font-size="13" font-weight="700" fill="#475569">Kubernetes namespace: k8s-demo</text>

  <!-- Frontend -->
  <rect x="214" y="120" width="200" height="120" rx="12" fill="url(#fe)" stroke="#38bdf8" filter="url(#shadow)"/>
  <text x="314" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Frontend Deployment</text>
  <text x="314" y="170" text-anchor="middle" font-size="12" fill="#0f172a">React + Nginx</text>
  <text x="314" y="190" text-anchor="middle" font-size="12" fill="#0f172a">replicas: 2</text>
  <text x="314" y="216" text-anchor="middle" font-size="11" fill="#475569">Nginx proxies /api → backend</text>
  <rect x="234" y="262" width="160" height="34" rx="17" fill="#fff" stroke="#0ea5e9"/>
  <text x="314" y="284" text-anchor="middle" font-size="11" fill="#0c4a6e">Service: frontend · NodePort 30080</text>

  <!-- Backend -->
  <rect x="470" y="120" width="190" height="120" rx="12" fill="url(#be)" stroke="#22c55e" filter="url(#shadow)"/>
  <text x="565" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Backend Deployment</text>
  <text x="565" y="170" text-anchor="middle" font-size="12" fill="#0f172a">FastAPI</text>
  <text x="565" y="190" text-anchor="middle" font-size="12" fill="#0f172a">replicas: 2</text>
  <text x="565" y="216" text-anchor="middle" font-size="11" fill="#475569">/api/health · /api/ready · /api/items</text>
  <rect x="490" y="262" width="150" height="34" rx="17" fill="#fff" stroke="#16a34a"/>
  <text x="565" y="284" text-anchor="middle" font-size="11" fill="#14532d">Service: backend · ClusterIP 8000</text>

  <!-- Database -->
  <rect x="716" y="120" width="180" height="120" rx="12" fill="url(#db)" stroke="#d946ef" filter="url(#shadow)"/>
  <text x="806" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#701a75">Database Deployment</text>
  <text x="806" y="170" text-anchor="middle" font-size="12" fill="#0f172a">Postgres 16</text>
  <text x="806" y="190" text-anchor="middle" font-size="12" fill="#0f172a">replicas: 1 (Recreate)</text>
  <rect x="736" y="262" width="140" height="34" rx="17" fill="#fff" stroke="#c026d3"/>
  <text x="806" y="284" text-anchor="middle" font-size="11" fill="#701a75">Service: db · ClusterIP 5432</text>

  <!-- PVC cylinder -->
  <g filter="url(#shadow)">
    <path d="M756 350 a50 12 0 0 1 100 0 v40 a50 12 0 0 1 -100 0 z" fill="#fdf4ff" stroke="#c026d3"/>
    <ellipse cx="806" cy="350" rx="50" ry="12" fill="#fae8ff" stroke="#c026d3"/>
  </g>
  <text x="806" y="378" text-anchor="middle" font-size="11" fill="#701a75">PVC 1Gi</text>
  <text x="806" y="392" text-anchor="middle" font-size="10" fill="#475569">data persists</text>

  <!-- Secret + ConfigMap -->
  <rect x="470" y="340" width="190" height="34" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="565" y="362" text-anchor="middle" font-size="11" fill="#713f12">Secret: db-secret (DB password)</text>
  <rect x="470" y="384" width="190" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="565" y="406" text-anchor="middle" font-size="11" fill="#334155">ConfigMaps: db / backend / frontend</text>

  <!-- Arrows -->
  <line x1="154" y1="255" x2="232" y2="279" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="394" y1="279" x2="488" y2="279" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="441" y="272" text-anchor="middle" font-size="10" fill="#475569">/api</text>
  <line x1="640" y1="279" x2="734" y2="279" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="806" y1="296" x2="806" y2="336" stroke="#c026d3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="340" x2="565" y2="302" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="470" y="476" text-anchor="middle" font-size="11" fill="#475569">Each tier: one image → one Deployment → one Service. The browser only ever reaches the frontend NodePort.</text>
</svg>
