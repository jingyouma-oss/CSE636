# .github/workflows/pr-review.yml
#
# Week 3 — agentic code review on pull requests. The counterpart to the
# build-fixer: build-fixer *repairs* a red build and opens a PR; this workflow
# *reviews* a PR and posts comments. Together they show the same lesson — an AI
# agent as a proposer behind a human gate — from two angles. They also form a
# loop: build-fixer opens a bot/fix-build-* PR, this reviews it, a human merges.
#
# Runs on GitHub-hosted runners (outside any corporate proxy), so it has none of
# the Zscaler TLS/DLP issues the Jenkins path hits.
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]   # on PR open and every new push to it

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # read the code being reviewed
      pull-requests: write      # post review comments — but NOT merge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history so the agent can diff against base

      - name: Run AI code review
        uses: anthropics/claude-code-action@v1
        env:
          # Direct Anthropic API key from repo secrets. The action reads it from
          # the environment; do NOT put the secret under `with:`.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          # `prompt` is the whole instruction — there is no `review_scope` input.
          prompt: |
            Review this pull request for security, correctness, and test coverage.
            Post inline comments on the specific lines that need attention, each with
            a concrete, actionable suggestion. Add one short summary comment on the PR.
            Be constructive and skip nitpicks. Do NOT approve or merge — a human does that.
          # `claude_args` are Claude Code CLI flags. `--allowed-tools` scopes what
          # the agent may do: post inline comments, add a PR comment, read the diff.
          # Swap the model to claude-haiku-4-5 for a cheaper classroom run.
          claude_args: >-
            --model claude-opus-4-8
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Read"

# The guardrail is TWO things, not a magic input:
#   1. permissions above grant only `pull-requests: write` — the agent can comment
#      but has no rights to merge or push to protected branches.
#   2. Require human approval by enabling branch protection on `main`
#      (Settings -> Branches -> Require a pull request review before merging).
# The agent proposes; a human still clicks "Approve" and merges.
